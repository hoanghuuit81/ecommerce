services:
  backend:
    build:
      context: ./backend
    container_name: ecommerce_backend
    working_dir: /var/www
    command: sh -c "chmod -R ug+rwX,o+rwX storage bootstrap/cache && php-fpm"
    volumes:
      - ./backend:/var/www
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - ecommerce

  nginx:
    image: nginx:alpine
    container_name: ecommerce_nginx
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - ecommerce

  frontend:
    image: node:24-alpine
    container_name: ecommerce_frontend
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: npm run dev -- --host 0.0.0.0
    networks:
      - ecommerce

  mysql:
    image: mysql:8.4
    container_name: ecommerce_mysql
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: ecommerce
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ecommerce

networks:
  ecommerce:

volumes:
  mysql_data:
  frontend_node_modules:
